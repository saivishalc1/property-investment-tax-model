name: CI

# Runs on every push and pull request. The point is that a rule pack cannot be
# changed without the golden cases and boundary tests running, so a rate edited
# by hand that breaks a published worked example fails here rather than in
# front of a client.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # tools/build.js fails the build on a broken local reference, a
        # root-absolute path that would 404 under the Pages subpath, anything
        # secret-shaped, or an external network origin in shipped code.
        run: npm run build

      - name: Unit and rule tests
        run: npm test

      - name: Assert the working tree is clean after a build
        # The asset stamp is committed, so a build that changes it means the
        # committed stamp did not match the source that was pushed.
        run: |
          if [ -n "$(git status --porcelain -- ':!dist')" ]; then
            echo "::error::The build modified tracked files. Run 'npm run build' and commit the result."
            git status --porcelain -- ':!dist'
            git --no-pager diff -- ':!dist'
            exit 1
          fi

  rule-hygiene:
    name: Rule pack hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Every rule must carry provenance, and none may be stale
        run: node tools/check-rules.js

  security:
    name: Dependency and secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Audit dependencies
        # The project ships no runtime dependencies; this guards the dev tree.
        run: npm audit --audit-level=moderate

      - name: Scan history for secret-shaped strings
        run: |
          set -o pipefail
          PATTERN='(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)'
          if git grep -nIE "$PATTERN" -- . ':!*.md' ':!.github/workflows/*'; then
            echo "::error::A secret-shaped string is present in the tree."
            exit 1
          fi
          echo "No secret-shaped strings found."

  e2e:
    name: End-to-end, accessibility and responsive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        run: npm run test:e2e

      - name: Upload the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
